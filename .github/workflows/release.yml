name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package version with tag
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Restore previous packages for delta updates
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "out/make/squirrel.windows/x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download --pattern "*.nupkg" --pattern "RELEASES" --dir $dir --clobber

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: npm run make

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/*Setup.exe
